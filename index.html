<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Imperio Burger</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#090909;
  color:white;
}

header{
  background:#050505;
  position:sticky;
  top:0;
  z-index:100;
  border-bottom:2px solid #ff9d00;
}

.header{
  text-align:center;
  padding:18px 10px 10px;
}

.logo{
  color:#ffad18;
  font-size:34px;
  font-weight:900;
}

.logo span{
  margin-right:8px;
}

.slogan{
  color:#ddd;
  margin-top:5px;
}

nav{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:14px 10px;
}

nav button{
  background:#222;
  color:white;
  border:1px solid #444;
  border-radius:20px;
  padding:9px 15px;
  white-space:nowrap;
  cursor:pointer;
}

nav button:hover{
  background:#ffad18;
  color:#111;
}

.hero{
  min-height:430px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
  background:
  radial-gradient(circle,#8b3d00 0%,#351506 35%,#160b06 75%);
}

.hero h1{
  font-size:clamp(40px,7vw,70px);
  margin-bottom:15px;
}

.hero p{
  font-size:22px;
  color:#ddd;
  margin-bottom:28px;
}

.btn{
  display:inline-block;
  background:#ffad18;
  color:#111;
  border:0;
  border-radius:12px;
  padding:15px 28px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:40px 18px 100px;
}

.titulo{
  text-align:center;
  color:#ffad18;
  font-size:30px;
  margin-bottom:10px;
}

.subtitulo{
  text-align:center;
  color:#bbb;
  margin-bottom:30px;
}

.buscar{
  width:100%;
  max-width:700px;
  display:block;
  margin:0 auto 35px;
  padding:15px;
  background:#151515;
  color:white;
  border:1px solid #444;
  border-radius:12px;
  outline:none;
}

.buscar:focus{
  border-color:#ffad18;
}

.categoria{
  margin-bottom:45px;
}

.categoria h2{
  color:#ffad18;
  border-bottom:1px solid #533400;
  padding-bottom:10px;
  margin-bottom:18px;
}

.productos{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:18px;
}

.producto{
  background:#161616;
  border:1px solid #292929;
  border-radius:16px;
  overflow:hidden;
}

.producto-imagen{
  height:100px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:55px;
  background:linear-gradient(135deg,#321b08,#111);
}

.producto-info{
  padding:16px;
}

.producto h3{
  font-size:20px;
  margin-bottom:7px;
}

.producto p{
  color:#aaa;
  font-size:14px;
  min-height:45px;
}

.precio{
  color:#ffad18;
  font-size:21px;
  font-weight:bold;
  margin:14px 0;
}

.agregar{
  width:100%;
  background:#ffad18;
  color:#111;
  border:0;
  padding:12px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.agregar:hover{
  background:#ffc04a;
}

.carrito-btn{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:200;
  background:#ffad18;
  color:#111;
  border:0;
  border-radius:30px;
  padding:15px 22px;
  font-weight:bold;
  font-size:16px;
  box-shadow:0 5px 25px #000;
  cursor:pointer;
}

.carrito-btn span{
  background:#111;
  color:#ffad18;
  padding:3px 8px;
  border-radius:20px;
  margin-left:5px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  z-index:300;
  align-items:flex-end;
  justify-content:center;
}

.modal.activo{
  display:flex;
}

.carrito{
  width:min(600px,100%);
  max-height:85vh;
  overflow:auto;
  background:#171717;
  border-radius:20px 20px 0 0;
  padding:22px;
}

.cabecera-carrito{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.cerrar{
  background:#333;
  color:white;
  border:0;
  padding:9px 12px;
  border-radius:8px;
  cursor:pointer;
}

.item-carrito{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:14px 0;
  border-bottom:1px solid #333;
}

.controles button{
  width:30px;
  height:30px;
  background:#333;
  color:white;
  border:0;
  border-radius:6px;
}

.total{
  display:flex;
  justify-content:space-between;
  color:#ffad18;
  font-size:23px;
  font-weight:bold;
  padding:20px 0;
}

.whatsapp{
  width:100%;
  background:#25d366;
  color:white;
  border:0;
  padding:15px;
  border-radius:10px;
  font-weight:bold;
  font-size:17px;
  cursor:pointer;
}

.vacio{
  text-align:center;
  color:#999;
  padding:30px;
}

.carta{
  margin-top:50px;
  background:#111;
  padding:20px;
  border-radius:18px;
}

.carta img{
  width:100%;
  max-width:900px;
  display:block;
  margin:15px auto;
  border-radius:12px;
}

footer{
  text-align:center;
  padding:30px;
  background:#050505;
  border-top:1px solid #533400;
  color:#999;
}

@media(max-width:600px){
  .logo{
    font-size:25px;
  }

  .hero{
    min-height:360px;
  }

  .hero h1{
    font-size:42px;
  }

  .hero p{
    font-size:18px;
  }

  .productos{
    grid-template-columns:1fr 1fr;
  }

  .producto h3{
    font-size:17px;
  }

  .producto p{
    font-size:12px;
  }

  .precio{
    font-size:18px;
  }
}

@media(max-width:400px){
  .productos{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">
🍔 EL IMPERIO BURGER
</div>

<div class="slogan">
El sabor que manda
</div>

<nav id="nav"></nav>

</div>

</header>

<section class="hero">

<div>

<h1>Bienvenido al Imperio</h1>

<p>
Las mejores hamburguesas, directamente a tu puerta.
</p>

<button class="btn" onclick="document.getElementById('menu').scrollIntoView()">
VER MENÚ
</button>

</div>

</section>

<main class="container" id="menu">

<h2 class="titulo">
NUESTRO MENÚ
</h2>

<p class="subtitulo">
Elige tus favoritos y agrégalos al carrito.
</p>

<input
class="buscar"
id="buscar"
placeholder="🔎 Buscar hamburguesa, papas, bebidas..."
>

<div id="productos"></div>

<section class="carta">

<h2 class="titulo">
NUESTRA CARTA
</h2>

<p class="subtitulo">
Consulta nuestra carta completa.
</p>

<img src="IMG-20260828-WA0008.jpg">

<img src="IMG-20260704-WA0015(1).jpg">

</section>

</main>

<button class="carrito-btn" onclick="abrirCarrito()">
🛒 Carrito
<span id="contador">0</span>
</button>

<div class="modal" id="modal">

<div class="carrito">

<div class="cabecera-carrito">

<h2>🛒 Tu pedido</h2>

<button class="cerrar" onclick="cerrarCarrito()">
✕
</button>

</div>

<div id="itemsCarrito"></div>

<div class="total">

<span>TOTAL</span>

<span id="total">$0</span>

</div>

<button class="whatsapp" onclick="enviarWhatsApp()">

📲 ENVIAR PEDIDO POR WHATSAPP

</button>

</div>

</div>

<footer>

<strong>EL IMPERIO BURGER</strong>

<br>

El sabor que manda 🍔

</footer>

<script>

const menu = [

{

]
},

]
},

{

productos:[

]
},

{

productos:[

["Burrito de carne",15000,"Carne desmechada."]

]
},

{
categoria:"🍽️ Platos especiales",
productos:[

]
},

{

productos:[

["Crepe dulce con frutas",15000,"Dulce con frutas."],

["Crepe mixto de carne y pollo",18000,"Mixto de carne y pollo."]

]
},

{
categoria:"🥤 Bebidas",
productos:[

["Limonada coco",10000,"Limonada especial."],

["Limonada hierbabuena",10000,"Limonada especial."],

["Limonada natural",10000,"Limonada natural."],

["Limonada cerveza",10000,"Limonada especial."],

["Limonada piña colada",10000,"Limonada especial."],

["Limonada frutos rojos",10000,"Limonada especial."],

["Limonada mango biche",10000,"Limonada especial."],

["Limonada de sandía",10000,"Limonada especial."],

["Granizado de café",10000,"Bebida fría."],

["Nevado de café",10000,"Bebida fría."]

]
},

{
categoria:"🥛 Malteadas",
productos:[

["Willy Wonka",14000,"Malteada."],

["Cookie & Cream",14000,"Malteada."],

["Brownie",14000,"Malteada."],

]
},

{

productos:[

]
},

{

},

productos:[

["Mixto carne y pollo",10000,"Sándwich mixto."]

]
},

{

productos:[

["Malteada + hamburguesa sencilla",20000,"Combo especial."],

["Malteada + sándwich",20000,"Combo especial."]

]
},

{
categoria:"🥑 Entradas",
productos:[

["Nachos",15000,"Entrada."],

]
},

{
categoria:"🍹 Micheladas",
productos:[

["Cerveza",9500,"Michelada."],

["Soda",7500,"Michelada."],

["Ginger",8000,"Michelada."]

]
},

{
categoria:"🍓 Heladería",
productos:[

["Fresas con crema",10000,"Postre."]

]
},

{
categoria:"🍸 Cócteles",
productos:[

["Mojito",14000,"Cóctel."],

["Margarita",14000,"Cóctel."],

["Daiquiri",14000,"Cóctel."],

["Tres Cordilleras",13000,"Cóctel."]

]
}

];

let carrito=[];

function dinero(valor){

return "$"+valor.toLocaleString("es-CO");

}

function mostrarMenu(filtro=""){

let contenedor=document.getElementById("productos");

let html="";

menu.forEach((categoria,index)=>{

let productos=categoria.productos.filter(p=>

(categoria.categoria+" "+p[0]+" "+p[2])

.toLowerCase()

.includes(filtro.toLowerCase())

);

if(productos.length===0)return;

html+=`

<section class="categoria">

<h2>${categoria.categoria}</h2>

<div class="productos">

`;

productos.forEach(p=>{

html+=`

<article class="producto">

<div class="producto-imagen">
${categoria.categoria.substring(0,2)}
</div>

<div class="producto-info">

<h3>${p[0]}</h3>

<p>${p[2]}</p>

<div class="precio">
${dinero(p[1])}
</div>

<button class="agregar"
onclick="agregar('${p[0].replace(/'/g,"\\'")}',${p[1]})">

➕ Agregar al carrito

</button>

</div>

</article>

`;

});

html+=`

</div>

</section>

`;

});

contenedor.innerHTML=html;

}

function mostrarCategorias(){

let nav=document.getElementById("nav");

nav.innerHTML="";

menu.forEach(c=>{

let boton=document.createElement("button");

boton.textContent=c.categoria;

boton.onclick=()=>{

document.getElementById("menu").scrollIntoView();

};

nav.appendChild(boton);

});

}

function agregar(nombre,precio){

let producto=carrito.find(p=>p.nombre===nombre);

if(producto){

producto.cantidad++;

}else{

carrito.push({

nombre:nombre,

precio:precio,

cantidad:1

});

}

actualizarCarrito();

}

function actualizarCarrito(){

let contenedor=document.getElementById("itemsCarrito");

let contador=document.getElementById("contador");

let total=document.getElementById("total");

let cantidad=0;

let suma=0;

if(carrito.length===0){

contenedor.innerHTML=

`<div class="vacio">Tu carrito está vacío 🍔</div>`;

}else{

contenedor.innerHTML="";

carrito.forEach((p,index)=>{

cantidad+=p.cantidad;

suma+=p.precio*p.cantidad;

let item=document.createElement("div");

item.className="item-carrito";

item.innerHTML=`

<div>

<strong>${p.nombre}</strong>

<br>

${dinero(p.precio)}

</div>

<div class="controles">

<button onclick="cambiarCantidad(${index},-1)">−</button>

<strong> ${p.cantidad} </strong>

<button onclick="cambiarCantidad(${index},1)">+</button>

</div>

`;

contenedor.appendChild(item);

});

}

contador.textContent=cantidad;

total.textContent=dinero(suma);

}

function cambiarCantidad(index,cambio){

carrito[index].cantidad+=cambio;

if(carrito[index].cantidad<=0){

carrito.splice(index,1);

}

actualizarCarrito();

}

function abrirCarrito(){

document.getElementById("modal").classList.add("activo");

actualizarCarrito();

}

function cerrarCarrito(){

document.getElementById("modal").classList.remove("activo");

}

function enviarWhatsApp(){

if(carrito.length===0){

alert("Agrega productos al carrito primero.");

return;

}

let mensaje="🍔 *PEDIDO EL IMPERIO BURGER*%0A%0A";

let total=0;

carrito.forEach(p=>{

let subtotal=p.precio*p.cantidad;

total+=subtotal;

mensaje+=

"• "+p.cantidad+" x "+p.nombre+

" - "+dinero(subtotal)+"%0A";

});

mensaje+=

"%0A💰 *TOTAL: "+dinero(total)+"*"+

"%0A%0AHola, quiero realizar este pedido.";

let numero="573208019324";

let url=

"https://wa.me/"+numero+

"?text="+mensaje;

window.open(url,"_blank");

}

document.getElementById("buscar").addEventListener(

"input",

function(){

mostrarMenu(this.value);

}

);

mostrarCategorias();

mostrarMenu();

actualizarCarrito();

</script>

</body>
