/* =====================================================
   SEGURIDAD HTML
===================================================== */

function escapeHTML(valor){

    if(valor === null || valor === undefined){
        return "";
    }

    return String(valor)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =====================================================
   FORMATEAR DINERO
===================================================== */

function dinero(valor){

    return Number(valor || 0)
        .toLocaleString("es-CO");
}


/* =====================================================
   NORMALIZAR ESTADO
===================================================== */

function normalizarEstado(estado){

    if(!estado){
        return "Nuevo";
    }

    const estados = {

        "Nuevo":
        "Nuevo",

        "Nuevo":
        "Nuevo",

        "Preparando":
        "En preparación",

        "preparando":
        "En preparación",

        "En preparación":
        "En preparación",

        "en preparación":
        "En preparación",

        "En camino":
        "En camino",

        "en camino":
        "En camino",

        "Entregado":
        "Entregado",

        "entregado":
        "Entregado",

        "Cancelado":
        "Cancelado",

        "cancelado":
        "Cancelado"

    };

    return estados[estado] || estado;
}


/* =====================================================
   LOGIN
===================================================== */

async function entrar(){

    const usuario =
        document
        .getElementById("usuario")
        .value
        .trim()
        .toLowerCase();

    const clave =
        document
        .getElementById("clave")
        .value;

    const error =
        document
        .getElementById("error");

    const loading =
        document
        .getElementById("loading");

    const boton =
        document
        .getElementById("btnLogin");


    error.innerText = "";


    if(!usuario || !clave){

        error.innerText =
        "Ingrese el correo y la contraseña.";

        return;
    }


    if(usuario !== ADMIN_EMAIL){

        error.innerText =
        "Este correo no tiene permisos de administrador.";

        return;
    }


    boton.disabled = true;

    loading.style.display = "block";


    try{

        const {
            data,
            error:loginError
        } =
        await db.auth.signInWithPassword({

            email:usuario,

            password:clave

        });


        if(loginError){

            throw loginError;

        }


        if(!data.user){

            throw new Error(
                "No se pudo obtener el usuario."
            );

        }


        if(
            !data.user.email ||
            data.user.email.toLowerCase() !==
            ADMIN_EMAIL
        ){

            await db.auth.signOut();

            throw new Error(
                "Usuario no autorizado."
            );

        }


        mostrarDashboard(
            data.user.email
        );


    }catch(e){

        console.error(
            "ERROR LOGIN:",
            e
        );

        error.innerText =
            e.message ||
            "No se pudo iniciar sesión.";

    }finally{

        boton.disabled = false;

        loading.style.display =
            "none";

    }

}

/* =====================================================
   PEDIDOS
===================================================== */

async function cargarPedidos(){

    const lista =
        document.getElementById(
            "listaPedidos"
        );


    if(!lista) return;


    lista.innerHTML =
        "⏳ Cargando pedidos...";


    const {
        data,
        error
    } =
    await db
    .from("pedidos")
    .select("*")
    .order(
        "id",
        {
            ascending:false
        }
    );


    if(error){

        console.error(error);

        lista.innerHTML = `
            <div class="order">
                ❌ Error cargando pedidos.
                <br><br>
                ${escapeHTML(error.message)}
            </div>
        `;

        return;

    }


    if(!data || data.length === 0){

        lista.innerHTML = `
            <div class="order">
                📦 No hay pedidos registrados todavía.
            </div>
        `;

        await actualizarResumen();

        return;

    }


    lista.innerHTML =
        data
        .map(function(pedido){

            return crearTarjetaPedido(
                pedido
            );

        })
        .join("");


    await actualizarResumen();

}


/* =====================================================

        dinero(
            pedido.total
        );

        normalizarEstado(
            pedido.estado
        );

        pedido.created_at

        new Date(
            pedido.created_at

    return `

    <div class="order">

            🛒 Pedido #${escapeHTML(pedido.id)}

            👤 ${escapeHTML(nombre)}
        </p>

        <p>
            📞 ${escapeHTML(telefono)}
        </p>

        <p>
            📍 ${escapeHTML(direccion)}
        </p>

        <p>
            📅 ${escapeHTML(fecha)}
        </p>

        <p>
            💰
            <strong style="color:#ffae19">
                $${total}
            </strong>
        </p>

        <span class="status">
            ${escapeHTML(estado)}
        </span>


        <div
            style="
                display:flex;
                gap:8px;
                flex-wrap:wrap;
                margin-top:15px;
            "
        >

            <button
                onclick="cambiarEstadoPedido(
                    ${Number(pedido.id)},
                    'Pendiente'
                )"
                style="
                    background:#777;
                    color:white;
                "
            >
                ⏳ PENDIENTE
            </button>


            <button
                onclick="cambiarEstadoPedido(
                    ${Number(pedido.id)},
                    'En preparación'
                )"
                style="
                    background:#f5a900;
                    color:#111;
                "
            >
                🍔 EN PREPARACIÓN
            </button>


            <button
                onclick="cambiarEstadoPedido(
                    ${Number(pedido.id)},
                    'En camino'
                )"
                style="
                    background:#1976d2;
                    color:white;
                "
            >
                🚴 EN CAMINO
            </button>


            <button
                onclick="cambiarEstadoPedido(
                    ${Number(pedido.id)},
                    'Entregado'
                )"
                style="
                    background:#28a745;
                    color:white;
                "
            >
                ✅ ENTREGADO
            </button>


            <button
                onclick="cambiarEstadoPedido(
                    ${Number(pedido.id)},

                    background:#dc3545;
                    color:white;
                "
            >
                ❌ CANCELAR

    `;

}


/* =====================================================
   CAMBIAR ESTADO
===================================================== */

async function cambiarEstadoPedido(
    id,
    nuevoEstado
){

    nuevoEstado =
        normalizarEstado(
            nuevoEstado
        );


    const confirmar =
        confirm(
            "¿Cambiar el pedido #" +
            id +
            " a: " +
            nuevoEstado +
            "?"
        );


    if(!confirmar){
        return;
    }


    const {
        error
    } =
    await db
    .from("pedidos")
    .update({

        estado:nuevoEstado

    })
    .eq(
        "id",
        id
    );


    if(error){

        console.error(error);

        alert(
            "❌ No se pudo cambiar el estado:\n\n" +
            error.message
        );

        return;

    }


    alert(
        "✅ Pedido #" +
        id +
        " actualizado a " +
        nuevoEstado
    );


    await cargarPedidos();

}


/* =====================================================
   REALTIME PEDIDOS
===================================================== */

function escucharPedidos(){

    if(canalPedidos){

        return;

    }


    canalPedidos =
        db
        .channel(
            "pedidos-tiempo-real"
        )


        /* NUEVO PEDIDO */

        .on(

            "postgres_changes",

            {
                event:"INSERT",
                schema:"public",
                table:"pedidos"
            },

            function(payload){

                console.log(
                    "📦 NUEVO PEDIDO:",
                    payload
                );


                mostrarNotificacion();


                cargarPedidos();

                actualizarResumen();

            }

        )


        /* ACTUALIZACIÓN */

        .on(

            "postgres_changes",

            {
                event:"UPDATE",
                schema:"public",
                table:"pedidos"
            },

            function(payload){

                console.log(
                    "🔄 PEDIDO ACTUALIZADO:",
                    payload
                );


                cargarPedidos();

                actualizarResumen();

            }

        )


        /* ELIMINACIÓN */

        .on(

            "postgres_changes",

            {
                event:"DELETE",
                schema:"public",
                table:"pedidos"
            },

            function(payload){

                console.log(
                    "🗑️ PEDIDO ELIMINADO:",
                    payload
                );


                cargarPedidos();

                actualizarResumen();

            }

        )


        .subscribe(
            function(status){

                console.log(
                    "Realtime pedidos:",
                    status
                );

            }
        );

}

/* =====================================================

async function verHistorialCliente(clienteId){

    try{

        const { data: cliente, error: errorCliente } =
            await db
            .from("clientes")
            .select(`
                id,
                nombre,
                telefono,
                direccion
            `)
            .eq("id", clienteId)
            .single();

        if(errorCliente){

            alert(
                "❌ No se pudo cargar el cliente:\n\n" +
                errorCliente.message
            );

            return;
        }


        const { data: pedidos, error: errorPedidos } =
            await db
            .from("pedidos")
            .select(`
                id,
                total,
                estado,
                observaciones,
                created_at
            `)
            .eq(
                "cliente_id",
                clienteId
            )
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(errorPedidos){

            alert(
                "❌ No se pudo cargar el historial:\n\n" +
                errorPedidos.message
            );

            return;
        }


        const listaPedidos =
            pedidos || [];


        const totalComprado =
            listaPedidos.reduce(
                (suma, pedido) =>
                    suma +
                    Number(
                        pedido.total || 0
                    ),
                0
            );


        const totalFormateado =
            totalComprado.toLocaleString(

            );


        let contenido = "";


        if(listaPedidos.length === 0){

            contenido = `

                    style="

                        text-align:center;
                        color:#bbb;
                    "

                    📦 Este cliente todavía
                    no tiene pedidos.
                </div>
            `;

        }else{

            contenido =
                listaPedidos.map(
                    pedido => {

                        const total =
                            Number(
                                pedido.total || 0
                            ).toLocaleString(
                                "es-CO"
                            );


                        const fecha =
                            pedido.created_at
                            ?
                            new Date(
                                pedido.created_at
                            ).toLocaleString(
                                "es-CO"
                            )
                            :
                            "Sin fecha";


                        return `

                        <div
                            style="

                                border:1px solid #333;
                                border-radius:12px;

                            "
                        >

                            <div
                                style="
                                    display:flex;
                                    justify-content:space-between;
                                    gap:10px;
                                    flex-wrap:wrap;
                                "
                            >

                                <strong
                                    style="
                                        color:#ffae19;
                                        font-size:18px;
                                    "
                                >
                                    🛒 Pedido #${pedido.id}
                                </strong>


                                <strong
                                    style="
                                        color:#ffae19;
                                        font-size:18px;
                                    "
                                >
                                    $${total}
                                </strong>

                            </div>


                            <p
                                style="
                                    margin-top:10px;
                                "
                            >
                                📅 ${escapeHTML(fecha)}
                            </p>


                            <p
                                style="
                                    margin-top:7px;
                                "
                            >
                                📦 Estado:
                                <strong>
                                    ${escapeHTML(
                                        pedido.estado ||
                                        "Nuevo"
                                    )}
                                </strong>
                            </p>


                            ${
                                pedido.observaciones
                                ?
                                `
                                <p
                                    style="
                                        margin-top:7px;
                                        color:#bbb;
                                    "
                                >
                                    📝
                                    ${escapeHTML(
                                        pedido.observaciones
                                    )}
                                </p>
                                `
                                :
                                ""
                            }

                        </div>

                        `;

                    }
                ).join("");

        }


        abrirModalHistorial(

            cliente,

            contenido,

            totalFormateado

        );


    }catch(error){

        console.error(error);

        alert(

        );

        producto.disponible !== false;


    const imagen =
        producto.imagen_url;


    return `

    <div class="product-card">

        <div class="product-content">

            ${
                imagen
                ?
                `
                <img
                    src="${escapeHTML(imagen)}"
                    class="product-img"
                    onerror="
                        this.style.display='none'
                    "
                >
                `
                :
                `
                <div
                    class="product-img"
                    style="
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        font-size:40px;
                    "
                >
                    🍔
                </div>
                `
            }


            <div class="product-info">

                <h3>
                    ${escapeHTML(
                        producto.nombre ||
                        "Sin nombre"
                    )}
                </h3>


                <p>
                    ${escapeHTML(
                        producto.descripcion ||
                        "Sin descripción"
                    )}
                </p>


                <p>
                    📂
                    ${escapeHTML(
                        producto.categoria ||
                        "Sin categoría"
                    )}
                </p>


                <p class="product-price">
                    💰 $${precio}
                </p>


                <span class="status">

                    ${
                        disponible
                        ?
                        "🟢 Disponible"
                        :
                        "🔴 No disponible"
                    }

                </span>

            </div>

        </div>


        <div class="product-actions">

            <button
                class="btn-edit"
                onclick="
                    editarProducto(
                        ${Number(producto.id)}
                    )
                "
            >
                ✏️ EDITAR
            </button>


            <button
                class="btn-toggle"
                onclick="
                    cambiarDisponibilidad(
                        ${Number(producto.id)},
                        ${disponible}
                    )

            >

                ${
                    disponible
                    ?
                    "🔴 DESACTIVAR"
                    :
                    "🟢 ACTIVAR"
                }

            </button>


            <button
                class="btn-delete"
                onclick="
                    eliminarProducto(
                        ${Number(producto.id)}
                    )
                "
            >
                🗑️ ELIMINAR
            </button>

        </div>

    </div>

    `;

}


/* =====================================================
   GUARDAR PRODUCTO
===================================================== */

async function guardarProducto(){

    const id =
        document
        .getElementById(
            "productoId"
        )
        .value;


    const nombre =
        document
        .getElementById(
            "productoNombre"
        )
        .value
        .trim();


    const descripcion =
        document
        .getElementById(
            "productoDescripcion"
        )
        .value
        .trim();


    const precio =
        Number(
            document
            .getElementById(
                "productoPrecio"
            )
            .value
        );


    const categoria =
        document
        .getElementById(
            "productoCategoria"
        )
        .value
        .trim();


    const imagen =
        document
        .getElementById(
            "productoImagen"
        )
        .value
        .trim();


    const disponible =
        document
        .getElementById(
            "productoDisponible"
        )
        .checked;


    const mensaje =
        document
        .getElementById(
            "productoMensaje"
        );


    if(!nombre){

        mensaje.innerText =
            "⚠️ Escriba el nombre del producto.";

        return;

    }


    if(isNaN(precio) || precio < 0){

        mensaje.innerText =
            "⚠️ Escriba un precio válido.";

        return;

    }


    mensaje.innerText =
        "⏳ Guardando producto...";


    const producto = {

        nombre:nombre,

        descripcion:
            descripcion || null,

        precio:precio,

        categoria:
            categoria || null,

        imagen_url:
            imagen || null,

        disponible:
            disponible

    };


    let resultado;


    if(id){

        resultado =
            await db
            .from("productos")
            .update(producto)
            .eq(
                "id",
                Number(id)
            );

    }else{

        resultado =
            await db
            .from("productos")
            .insert([
                producto
            ]);

    }


    if(resultado.error){

        console.error(
            resultado.error
        );


        mensaje.innerText =
            "❌ " +
            resultado.error.message;

        return;

    }


    mensaje.innerText =
        "✅ Producto guardado correctamente.";


    limpiarFormulario();

    await cargarProductos();

}

/* =====================================================
   VENTAS
===================================================== */

async function cargarVentas(){

    const elemento =
        document.getElementById(
            "ventasDia"
        );


    if(!elemento){
        return;
    }


    const hoy =
        new Date();


    const inicio =
        new Date(
            hoy.getFullYear(),
            hoy.getMonth(),
            hoy.getDate()
        );


    const fin =
        new Date(
            hoy.getFullYear(),
            hoy.getMonth(),
            hoy.getDate() + 1
        );


    const {
        data,
        error
    } =
    await db
    .from("pedidos")
    .select("total,estado,created_at")
    .gte(
        "created_at",
        inicio.toISOString()
    )
    .lt(
        "created_at",
        fin.toISOString()
    );


    if(error){

        console.error(
            "VENTAS:",
            error
        );

        elemento.innerText =
            "$0";

        return;

    }


    let total = 0;


    if(data){

        data.forEach(function(pedido){

            const estado =
                normalizarEstado(
                    pedido.estado
                );


            if(
                estado !== "Cancelado"
            ){

                total +=
                    Number(
                        pedido.total || 0
                    );

            }

        });

    }


    elemento.innerText =
        "$" +
        dinero(total);

}

async function actualizarResumen(){

    try{

        const {
            data,
            error
        } =
        await db
        .from("pedidos")
        .select(
            "id,total,estado"
        );


        if(error){

            console.error(
                "RESUMEN:",
                error
            );

            return;

        }


        const pedidos =
            data || [];


        let ventas = 0;

        let enCamino = 0;


        pedidos.forEach(
            function(pedido){

                const estado =
                    normalizarEstado(
                        pedido.estado
                    );


                if(
                    estado !==
                    "Cancelado"
                ){

                    ventas +=
                        Number(
                            pedido.total || 0
                        );

                }


                if(
                    estado ===
                    "En camino"
                ){

                    enCamino++;

                }

            }
        );


        const totalPedidos =
            document.getElementById(
                "totalPedidos"
            );


        const totalVentas =
            document.getElementById(
                "totalVentas"
            );


        const totalCamino =
            document.getElementById(
                "totalCamino"
            );


        if(totalPedidos){

            totalPedidos.innerText =
                pedidos.length;

        }


        if(totalVentas){

            totalVentas.innerText =
                "$" +
                dinero(ventas);

        }


        if(totalCamino){

            totalCamino.innerText =
                enCamino;

        }


        /*
           Clientes:
           intentamos obtener cantidad
           de la tabla clientes.
        */

        const {
            count
        } =
        await db
        .from("clientes")
        .select(
            "*",
            {
                count:"exact",
                head:true
            }
        );


        const totalClientes =
            document.getElementById(
                "totalClientes"
            );


        if(totalClientes){

            totalClientes.innerText =
                count || 0;

        }

    }catch(e){

        console.error(
            "ERROR RESUMEN:",
            e
        );

    }

}
