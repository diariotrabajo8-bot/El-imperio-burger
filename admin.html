/* =====================================================
   LOGIN
===================================================== */

async function entrar(){

    const usuario =
        document.getElementById("usuario")
        .value
        .trim()
        .toLowerCase();

    const clave =
        document.getElementById("clave")
        .value;

    const error =
        document.getElementById("error");

    const loading =
        document.getElementById("loading");

    const boton =
        document.getElementById("btnLogin");


    error.innerText = "";


    if(!usuario || !clave){

        error.innerText =
        "Ingrese el correo y la contraseña.";

        return;
    }


    if(usuario !== ADMIN_EMAIL){

        error.innerText =
        "Este correo no tiene permisos de administrador.";

        return;
    }


    boton.disabled = true;
    loading.style.display = "block";


    try{

        const { data, error: loginError } =
            await db.auth.signInWithPassword({

                email: usuario,

                password: clave

            });


        if(loginError){

            throw loginError;

        }


        if(!data.user){

            throw new Error(
                "No se pudo obtener el usuario."
            );

        }


        if(
            !data.user.email ||
            data.user.email.toLowerCase() !==
            ADMIN_EMAIL
        ){

            await db.auth.signOut();

            throw new Error(
                "Usuario no autorizado."
            );

        }


        mostrarDashboard(
            data.user.email
        );


    }catch(e){

        console.error(
            "ERROR LOGIN:",
            e
        );

        error.innerText =
            e.message ||
            "No se pudo iniciar sesión.";

    }finally{

        boton.disabled = false;

        loading.style.display =
            "none";

    }

}

/* =====================================================
   PEDIDOS
===================================================== */

async function cargarPedidos(){

    const lista =
        document.getElementById(
            "listaPedidos"
        );


    if(!lista) return;


    lista.innerHTML =
        "⏳ Cargando pedidos...";


    const { data, error } =
        await db
        .from("pedidos")
        .select("*")
        .order(
            "id",
            {
                ascending:false
            }
        );


    if(error){

        console.error(error);

        lista.innerHTML = `
            <div class="order">
                ❌ Error cargando pedidos.
                <br><br>
                ${escapeHTML(error.message)}
            </div>
        `;

        return;

    }


    if(!data || data.length === 0){

        lista.innerHTML = `
            <div class="order">
                📦 No hay pedidos registrados todavía.
            </div>
        `;

        actualizarResumen();

        return;

    }


    lista.innerHTML =
        data.map(pedido =>
            crearTarjetaPedido(pedido)
        ).join("");


    actualizarResumen();

}


/* =====================================================

        Number(
            pedido.total || 0
        ).toLocaleString("es-CO");

        </p>

            📍 ${escapeHTML(direccion)}
        </p>

        <p>
            📅 ${escapeHTML(fecha)}
        </p>

        <p>
            💰
            <strong style="color:#ffae19">
                $${total}
            </strong>
        </p>

        <span class="status">
            ${escapeHTML(estado)}
        </span>

        <div
            style="

                margin-top:15px;
            "
        >

            <button
                onclick="cambiarEstadoPedido(
                    ${pedido.id},

                )"
                style="
                    background:#777;
                    color:white;
                "
            >
                ⏳ PENDIENTE
            </button>


            <button
                onclick="cambiarEstadoPedido(
                    ${pedido.id},
                    'Preparando'
                )"
                style="
                    background:#f5a900;
                    color:#111;
                "
            >
                🍔 PREPARANDO
            </button>


            <button
                onclick="cambiarEstadoPedido(
                    ${pedido.id},
                    'En camino'
                )"
                style="
                    background:#1976d2;
                    color:white;
                "
            >
                🚴 EN CAMINO
            </button>


            <button
                onclick="cambiarEstadoPedido(
                    ${pedido.id},

                )"

                    background:#28a745;
                    color:white;
                "

                onclick="cambiarEstadoPedido(
                    ${pedido.id},

                ❌ CANCELAR

}


/* =====================================================
   CAMBIAR ESTADO PEDIDO
===================================================== */

async function cambiarEstadoPedido(
    id,
    nuevoEstado
){

    const confirmar =
        confirm(
            "¿Cambiar el pedido #" +
            id +
            " a: " +
            nuevoEstado +
            "?"
        );


    if(!confirmar) return;


    const { error } =
        await db
        .from("pedidos")
        .update({

            estado:nuevoEstado

        })
        .eq(
            "id",
            id
        );


    if(error){

        alert(
            "❌ No se pudo cambiar el estado:\n\n" +
            error.message
        );

        return;

    }


    alert(
        "✅ Pedido #" +
        id +
        " actualizado."
    );


    await cargarPedidos();

}


/* =====================================================
   REALTIME PEDIDOS
===================================================== */

function escucharPedidos(){

    if(canalPedidos){

        return;

    }


    canalPedidos =
        db
        .channel(
            "pedidos-tiempo-real"
        )
        .on(

            "postgres_changes",

            {
                event:"INSERT",
                schema:"public",
                table:"pedidos"
            },

            function(payload){

                console.log(
                    "Nuevo pedido:",
                    payload
                );


                mostrarNotificacion();


                cargarPedidos();

                actualizarResumen();

            }

        )
        .on(

            "postgres_changes",

            {
                event:"UPDATE",
                schema:"public",
                table:"pedidos"
            },

            function(payload){

                console.log(
                    "Pedido actualizado:",
                    payload
                );


                cargarPedidos();

                actualizarResumen();

            }

        )
        .on(

            "postgres_changes",

            {
                event:"DELETE",
                schema:"public",
                table:"pedidos"
            },

            function(payload){

                console.log(
                    "Pedido eliminado:",
                    payload
                );


                cargarPedidos();

                actualizarResumen();

            }

        )
        .subscribe(
            function(status){

                console.log(
                    "Realtime pedidos:",
                    status
                );

            }
        );

}

        ).toLocaleString(

        );

        producto.disponible !== false;


    const imagen =
        producto.imagen_url;


    return `

    <div class="product-card">

        <div class="product-content">

            ${
                imagen
                ?
                `
                <img
                    src="${escapeHTML(imagen)}"
                    class="product-img"
                    onerror="
                        this.style.display='none'
                    "
                >
                `
                :
                `
                <div
                    class="product-img"
                    style="
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        font-size:40px;
                    "
                >
                    🍔
                </div>
                `
            }


            <div class="product-info">

                <h3>
                    ${escapeHTML(
                        producto.nombre ||
                        "Sin nombre"
                    )}
                </h3>

                <p>
                    ${escapeHTML(
                        producto.descripcion ||
                        "Sin descripción"
                    )}
                </p>

                <p>
                    📂
                    ${escapeHTML(
                        producto.categoria ||
                        "Sin categoría"
                    )}
                </p>

                <p class="product-price">
                    💰 $${precio}
                </p>

                <span class="status">

                    ${
                        disponible
                        ?
                        "🟢 Disponible"
                        :
                        "🔴 No disponible"
                    }

                </span>

            </div>

        </div>


        <div class="product-actions">

            <button
                class="btn-edit"
                onclick="
                    editarProducto(
                        ${producto.id}
                    )
                "
            >
                ✏️ EDITAR
            </button>


            <button
                class="btn-toggle"
                onclick="
                    cambiarDisponibilidad(
                        ${producto.id},
                        ${disponible}
                    )
                "
            >

                ${
                    disponible
                    ?
                    "🔴 DESACTIVAR"
                    :
                    "🟢 ACTIVAR"
                }

            </button>


            <button
                class="btn-delete"
                onclick="
                    eliminarProducto(
                        ${producto.id}
                    )
                "
            >
                🗑️ ELIMINAR
            </button>

        </div>

    </div>

    `;

}


/* =====================================================
   GUARDAR PRODUCTO
===================================================== */

async function guardarProducto(){

    const id =
        document
        .getElementById(
            "productoId"
        )
        .value;


    const nombre =
        document
        .getElementById(
            "productoNombre"
        )
        .value
        .trim();


    const descripcion =
        document
        .getElementById(
            "productoDescripcion"
        )
        .value
        .trim();


    const precio =
        Number(
            document
            .getElementById(
                "productoPrecio"
            )
            .value
        );


    const categoria =
        document
        .getElementById(
            "productoCategoria"
        )
        .value
        .trim();


    const imagen =
        document
        .getElementById(
            "productoImagen"
        )
        .value
        .trim();


    const disponible =
        document
        .getElementById(
            "productoDisponible"
        )
        .checked;


    const mensaje =
        document
        .getElementById(
            "productoMensaje"
        );


    if(!nombre){

        mensaje.innerText =
            "⚠️ Escriba el nombre del producto.";

        return;

    }


    if(isNaN(precio) || precio < 0){

        mensaje.innerText =
            "⚠️ Escriba un precio válido.";

        return;

    }


    mensaje.innerText =
        "⏳ Guardando producto...";


    const producto = {

        nombre:nombre,

        descripcion:
            descripcion || null,

        precio:precio,

        categoria:
            categoria || null,

        imagen_url:
            imagen || null,

        disponible:
            disponible

    };


    let resultado;


    if(id){

        resultado =
            await db
            .from("productos")
            .update(producto)
            .eq(
                "id",
                Number(id)
            );

    }else{

        resultado =
            await db
            .from("productos")
            .insert([
                producto
            ]);

    }


    if(resultado.error){

        console.error(
            resultado.error
        );


        mensaje.innerText =
            "❌ " +
            resultado.error.message;

        return;

    }


    mensaje.innerText =
        "✅ Producto guardado correctamente.";


    limpiarFormulario();


    await cargarProductos();

}
